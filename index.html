<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ランダム選択（完全版）</title>

<style>
body {font-family:sans-serif;margin:0;background:#f5f5f5;font-size:12px;}
.container{max-width:420px;margin:auto;padding:10px;}
button{padding:6px 10px;margin:3px;border:none;border-radius:6px;background:#007bff;color:white;}
button:active{transform:scale(0.95);}
.result{display:flex;flex-wrap:wrap;gap:5px;}
.card{background:white;padding:6px;border-radius:6px;min-width:55px;text-align:center;animation:pop .25s;}
.section{margin-top:8px;}
.triple{display:flex;gap:5px;}
@keyframes pop{from{transform:scale(.8);opacity:0;}to{transform:scale(1);opacity:1;}}
</style>
</head>

<body>
<div class="container">

<h2>拡張選択</h2>
<label><input type="checkbox" id="base" checked> レーフワーテル+重役拡張</label>
<label><input type="checkbox" id="expA"> ブラジル・日本</label>
<label><input type="checkbox" id="expB"> ファン拡張</label>

<div>
<button onclick="draw()">抽選</button>
<button onclick="drawCountries()">国</button>
<button onclick="drawItems()">重役</button>
</div>

<div class="section"><h3>国</h3><div id="r1" class="result"></div></div>
<div class="section"><h3>重役</h3><div id="r2" class="result"></div></div>
<div class="section"><h3>水</h3><div id="r3" class="result"></div></div>

<div class="section">
<h3>中立ダム</h3>
<div class="triple">
<div id="r4"></div>
<div id="r6"></div>
<div id="r5"></div>
</div>
</div>

<div class="section"><h3>ラウンド目標</h3><div id="r7" class="result"></div></div>
<div class="section"><h3>最終目標</h3><div id="r8" class="result"></div></div>
<div class="section"><h3>家</h3><div id="r9" class="result"></div></div>
<div class="section"><h3>国家契約</h3><div id="r10" class="result"></div></div>

</div>

<script>

// ===== データ =====
const BASE = {
countries:["ブラジル","イタリア","アメリカ","フランス","日本","ドイツ","オランダ"],
items:["ジル","ソロモン","発電４＜４","tommaso","３建物４水","wu fang","マーゴット","アントン","Dr.oct","スペンサー","シモーネ","基礎３３３""水=水即","ふたり建設"],
codes:["0121","0102","0013","0220","0012","1111","1022","2020"],
numbers:["山1","山2","山3","山4"],
oka:["丘1","丘2","丘3"],
hirano:["平野1","平野2","平野3"],
extras:["基礎","道管","発電所","上部","上級タイル","家","契約","外注"],
conditions:["エリア＞","≧３","≧１","＜","赤枠","つながってる＞"],
pairs:["1-2","3-4","1-3","1-5","4-3","2-1","3-5","4-1","6-2","2-2"],
last:["４グル","３水","４資材","８金","６→","１２点"]
};

const EXP_A = {
countries:["ブラジル","日本"]
};

const EXP_B = {
items:["電子ちゃん","水→1金","水が資材","上部♾️","上部 道管 発電所回収","3金銀行","国家爆乳女","2人→基礎","人が資材","5金=3点","！7→","生産→金"]
};

// ===== 共通 =====
function r(a,n){return [...a].sort(()=>0.5-Math.random()).slice(0,n)}

// ===== 合成 =====
function getData(){
let d = {
countries:[],items:[],codes:[],numbers:[],oka:[],hirano:[],
extras:[],conditions:[],pairs:[],last:[]
};

// ★ baseは常に適用（チェック無視）
Object.keys(BASE).forEach(k=>d[k]=d[k].concat(BASE[k]));

// 拡張のみチェックで追加
if(expA.checked){
  Object.keys(EXP_A).forEach(k=>d[k]=d[k].concat(EXP_A[k]));
}
if(expB.checked){
  Object.keys(EXP_B).forEach(k=>d[k]=d[k].concat(EXP_B[k]));
}

return d;
}

// ===== 描画 =====
function draw(){
const d=getData();
drawCountries();
drawItems();

r3.innerHTML=r(d.codes,4).map(v=>`<div class=card>${v}</div>`).join("");
r4.innerHTML=r(d.numbers,1).map(v=>`<div class=card>${v}</div>`).join("");
r6.innerHTML=r(d.oka,1).map(v=>`<div class=card>${v}</div>`).join("");
r5.innerHTML=r(d.hirano,1).map(v=>`<div class=card>${v}</div>`).join("");
r7.innerHTML=r(d.extras,5).map(v=>`<div class=card>${v}</div>`).join("");
r8.innerHTML=r(d.conditions,1).map(v=>`<div class=card>${v}</div>`).join("");
r9.innerHTML=r(d.pairs,5).map(v=>`<div class=card>${v}</div>`).join("");
r10.innerHTML=r(d.last,3).map(v=>`<div class=card>${v}</div>`).join("");
}

function drawCountries(){
const d=getData();
r1.innerHTML=r(d.countries,5).map(v=>`<div class=card>${v}</div>`).join("");
}

function drawItems(){
const d=getData();
r2.innerHTML=r(d.items,5).map(v=>`<div class=card>${v}</div>`).join("");
}

// ===== 保存 =====
document.querySelectorAll("input").forEach(el=>{
el.onchange=()=>localStorage.setItem(el.id,el.checked);
});

window.onload=()=>{
document.querySelectorAll("input").forEach(el=>{
el.checked=localStorage.getItem(el.id)!=="false";
});
}

</script>

</body>
</html>
