<!DOCTYPE html>

<html lang="ja"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> <title>バラージ セットアップ</title>

<style> :root{ --main:#007bff; } body{ font-family:sans-serif; margin:0; background:#f5f5f5; font-size:15px; -webkit-tap-highlight-color: transparent; } .container{ max-width:600px; margin:auto; padding:14px; padding-bottom:100px; } h2{margin:5px 0 10px;} /* ===== トグルスイッチ ===== */ .switch{ display:flex; align-items:center; gap:12px; padding:12px; background:white; border-radius:12px; margin-bottom:8px; cursor:pointer; } .switch input{ display:none; } .slider{ position:relative; width:42px; height:24px; background:#ccc; border-radius:20px; transition:.3s; } .slider::before{ content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:white; border-radius:50%; transition:.3s; } .switch input:checked + .slider{ background:var(--main); } .switch input:checked + .slider::before{ transform:translateX(18px); } /* ===== ボタン ===== */ button{ font-size:16px; padding:12px; border:none; border-radius:10px; background:var(--main); color:white; width:100%; } button:active{transform:scale(.96);} /* ON/OFFボタン */ .topBtns{ display:flex; gap:8px; margin-bottom:10px; } /* 固定ボタン */ .fixed{ position:fixed; bottom:0; left:0; right:0; display:flex; gap:8px; padding:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); background:white; box-shadow:0 -2px 6px rgba(0,0,0,0.1); } .fixed button{ flex:1; } /* ===== 結果 ===== */ .section{margin-top:14px;} .result{ display:grid; grid-template-columns:repeat(auto-fill,minmax(75px,1fr)); gap:8px; } .card{ background:white; padding:12px 6px; border-radius:12px; text-align:center; font-size:13px; animation:pop .25s; } .triple{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; } @keyframes pop{ from{transform:scale(.85);opacity:0;} to{transform:scale(1);opacity:1;} } </style>

</head>

<body>

<div class="container">

<h2>バラージ ランダムセットアップ</h2>

<label class="switch"> <input type="checkbox" id="expA"> <span class="slider"></span> レーフワーテル+重役拡張 </label>

<label class="switch"> <input type="checkbox" id="expB"> <span class="slider"></span> ブラジル・日本 </label>

<label class="switch"> <input type="checkbox" id="expF"> <span class="slider"></span> ファン拡張 </label>

<div class="topBtns"> <button onclick="allOn()">全部ON</button> <button onclick="allOff()">全部OFF</button> </div>

<div class="section"><h3>国</h3><div id="r1" class="result"></div></div> <div class="section"><h3>重役</h3><div id="r2" class="result"></div></div> <div class="section"><h3>水</h3><div id="r3" class="result"></div></div>

<div class="section"> <h3>中立ダム</h3> <div class="triple"> <div id="r4"></div> <div id="r6"></div> <div id="r5"></div> </div> </div>

<div class="section"><h3>ラウンド目標</h3><div id="r7" class="result"></div></div> <div class="section"><h3>最終目標</h3><div id="r8" class="result"></div></div> <div class="section"><h3>家</h3><div id="r9" class="result"></div></div> <div class="section"><h3>国家契約</h3><div id="r10" class="result"></div></div>

</div>

<div class="fixed"> <button onclick="draw()">抽選</button> <button onclick="drawCountries()">国のみ</button> <button onclick="drawItems()">重役のみ</button> </div>

<script> const expA = document.getElementById("expA"); const expB = document.getElementById("expB"); const expF = document.getElementById("expF"); const BASE = { countries:["イタリア","アメリカ","フランス","ドイツ"], items:["ジル","ソロモン","発電４＜４","３建物４水","アントン","基礎３３３","マヒリ"], codes:["0121","0102","0013","0220","0012","1111","1022","2020"], numbers:["山1","山2","山3","山4"], oka:["丘1","丘2","丘3"], hirano:["平野1","平野2","平野3"], extras:["基礎","道管","発電所","上部","上級タイル","家","契約","外注"], conditions:["エリア＞","≧３","≧１","＜","赤枠","つながってる＞"], pairs:[], last:["４グル","３水","４資材","８金","６→","１２点"] }; const EXP_A = { countries:["オランダ"], items:["黄ワーカー","wu fang","マーゴット","Dr.oct","スペンサー","シモーネ","水=水即","ふたり建設"], extras:["家","外注"], pairs:["1-2","3-4","1-3","1-5","4-3","2-1","3-5","4-1","6-2","2-2"] }; const EXP_B = { countries:["ブラジル","日本"] }; const EXP_F = { items:["電子ちゃん","水→1金","水が資材","上部♾️","上部 道管 発電所回収","3金銀行","国家爆乳女","2人→基礎","人が資材","5金=3点","！7→","生産→金"] }; function r(a,n){return [...a].sort(()=>0.5-Math.random()).slice(0,n)} function getData(){ let d={countries:[],items:[],codes:[],numbers:[],oka:[],hirano:[],extras:[],conditions:[],pairs:[],last:[]}; Object.keys(BASE).forEach(k=>d[k]=d[k].concat(BASE[k])); if(expA.checked){Object.keys(EXP_A).forEach(k=>d[k]=d[k].concat(EXP_A[k]));} if(expB.checked){Object.keys(EXP_B).forEach(k=>d[k]=d[k].concat(EXP_B[k]));} if(expF.checked){Object.keys(EXP_F).forEach(k=>d[k]=d[k].concat(EXP_F[k]));} return d; } function draw(){ const d=getData(); r1.innerHTML=r(d.countries,5).map(v=>`<div class=card>${v}</div>`).join(""); r2.innerHTML=r(d.items,5).map(v=>`<div class=card>${v}</div>`).join(""); r3.innerHTML=r(d.codes,4).map(v=>`<div class=card>${v}</div>`).join(""); r4.innerHTML=r(d.numbers,1).map(v=>`<div class=card>${v}</div>`).join(""); r6.innerHTML=r(d.oka,1).map(v=>`<div class=card>${v}</div>`).join(""); r5.innerHTML=r(d.hirano,1).map(v=>`<div class=card>${v}</div>`).join(""); r7.innerHTML=r(d.extras,5).map(v=>`<div class=card>${v}</div>`).join(""); r8.innerHTML=r(d.conditions,1).map(v=>`<div class=card>${v}</div>`).join(""); r9.innerHTML=r(d.pairs,5).map(v=>`<div class=card>${v}</div>`).join(""); r10.innerHTML=r(d.last,3).map(v=>`<div class=card>${v}</div>`).join(""); } function drawCountries(){const d=getData();r1.innerHTML=r(d.countries,5).map(v=>`<div class=card>${v}</div>`).join("");} function drawItems(){const d=getData();r2.innerHTML=r(d.items,5).map(v=>`<div class=card>${v}</div>`).join("");} function allOn(){ document.querySelectorAll('input[type="checkbox"]').forEach(el=>{ el.checked=true; localStorage.setItem(el.id,true); }); } function allOff(){ document.querySelectorAll('input[type="checkbox"]').forEach(el=>{ el.checked=false; localStorage.setItem(el.id,false); }); } document.querySelectorAll("input").forEach(el=>{ el.onchange=()=>localStorage.setItem(el.id,el.checked); }); window.onload=()=>{ document.querySelectorAll("input").forEach(el=>{ el.checked=localStorage.getItem(el.id)!=="false"; }); } </script>

</body> </html>
